[project]
name = "llm-async-codex"
version = "0.1.1"
description = "ChatGPT Codex subscription provider for llm-async"
readme = "README.md"
license = "MIT"
keywords = ["llm", "codex", "chatgpt", "openai", "asyncio", "ai", "oauth", "streaming", "tool calling"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    {name = "Johanderson Mogollon",email = "johander1822@gmail.com"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "llm-async (>=0.5.2)",
    "aiosonic (>=1.0.6)"
]

[project.scripts]
llm-async-codex = "llm_async_codex.cli:main"

[project.urls]
Homepage = "https://github.com/sonic182/llm-async-codex"
Repository = "https://github.com/sonic182/llm-async-codex"
Documentation = "https://github.com/sonic182/llm-async-codex#readme"
"Bug Tracker" = "https://github.com/sonic182/llm-async-codex/issues"
Changelog = "https://github.com/sonic182/llm-async-codex/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest (>=7.0)",
    "ruff (>=0.8)"
]


[tool.poetry]
packages = [{ include = "llm_async_codex", from = "src" }]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
